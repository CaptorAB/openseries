name: build.yml

permissions:
  contents: read
  actions: read  # Required for setup-python and other actions to read action metadata

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  UV_VERSION: "0.13.6"
  UV_PROJECT_ENVIRONMENT: venv

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch: {}

jobs:

  windows:
    name: Build on Windows
    runs-on: windows-latest
    permissions:
      contents: read
      issues: write  # Required for actions/github-script to create issues on test failure
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11', '3.12', '3.13', '3.14', '3.15' ]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          cache-suffix: py${{ matrix.python-version }}

      - name: Sync dependencies (locked)
        run: uv sync --locked --extra dev

      - name: Check and fix with Ruff
        run: uv run ruff check ./tests/*.py ./openseries/*.py --fix --exit-non-zero-on-fix

      - name: Format with Ruff
        run: uv run ruff format

      - name: Type check with Mypy
        run: uv run mypy .

      - name: Tests with Pytest
        id: pytest
        continue-on-error: true
        run: uv run pytest
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Create GitHub issue on failure
        if: ${{ steps.pytest.outcome == 'failure' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const { GH_OWNER, GH_REPO, GH_RUN_URL } = process.env;
            await github.rest.issues.create({
              owner: GH_OWNER,
              repo: GH_REPO,
              title: `Tests failed on ${new Date().toDateString()}`,
              body: `See the full logs here: ${GH_RUN_URL}`,
            });

      - name: Fail job if tests failed
        if: ${{ steps.pytest.outcome == 'failure' }}
        run: exit 1

      - name: Package and check
        run: |
          uv build
          uvx twine check dist/*

  ubuntu:
    name: Build on Ubuntu
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write  # Required for actions/github-script to create issues on test failure
