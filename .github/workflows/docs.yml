name: docs.yml

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  UV_VERSION: "0.11.21"
  UV_PROJECT_ENVIRONMENT: venv

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - 'openseries/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.readthedocs.yaml'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'docs/**'
      - 'openseries/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.readthedocs.yaml'
      - '.github/workflows/docs.yml'
  workflow_dispatch: {}

jobs:
  build:
    name: Build documentation
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out GitHub repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ (github.event_name == 'workflow_dispatch' && github.ref) || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup_python
        with:
          python-version-file: '.python-version'

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Sync dependencies (locked)
        run: uv sync --locked --extra docs

      - name: Build documentation
        run: uv run --directory docs make builddocs

      - name: Check for documentation warnings
        run: uv run --directory docs make strict

      - name: Upload HTML artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-html
          path: docs/build/html
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy documentation
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write  # Required for actions/deploy-pages to deploy to GitHub Pages
      id-token: write  # Required for OIDC token for GitHub Pages deployment
    environment:
      name: github-pages
    steps:
      - name: Download HTML artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-html
          path: docs/build/html

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
